function admin(){if(!adminOK())return;let u=Object.values(db.users),answers=u.reduce((n,x)=>n+x.answers,0),words=u.reduce((n,x)=>n+x.words.length,0),pop=Object.entries(db.analytics.views).sort((a,b)=>b[1]-a[1])[0]?.[0]||'Noch keine Daten';open('<div class="dialog"><div class="dialog-top"><div><p class="eyebrow">ADMIN</p><h2>Inhaltsverwaltung & Statistik</h2></div><button class="icon" onclick="close()">✕</button></div><div class="grid metrics"><article class="card metric">Schüler<b>'+u.length+'</b></article><article class="card metric">Aktive Nutzer<b>'+u.length+'</b></article><article class="card metric">Aufgaben<b>'+answers+'</b></article><article class="card metric">Wörter<b>'+words+'</b></article></div><div class="grid" style="margin-top:15px"><form class="card form" onsubmit="event.preventDefault();publish()"><h3>Neue Aufgabe</h3><label>Zielbereich<select id="sect"><option>Sprachniveaus A1–B2</option><option>Beruf & Spezial</option><option>Wortschatz</option></select></label><label>Thema / Kategorie<input id="topic" required></label><label>Aufgabentyp wählen<select id="type"><option>Multiple Choice</option><option>Lückentext</option><option>Fehlerkorrektur</option><option>Satzbau</option><option>Kontext-Übung</option><option>Wortschatz</option><option>Hörverstehen</option><option>Interaktiver Dialog</option><option>Grammatik-Regel</option></select></label><label>Inhalt<textarea id="task" placeholder="[ Option 1 | Option 2 | Option 3 -> Richtig ]"></textarea></label><label>image_url (optional)<input id="img"></label><label>audio_url (optional)<input id="audio"></label><div class="grid" style="grid-template-columns:1fr 1fr"><button type="button" class="secondary" onclick="preview()">👁️ Vorschau</button><button class="primary">🚀 Veröffentlichen</button></div><p id="msg" class="hidden notice"></p></form><aside class="card"><h3>Analyse & Monetarisierung</h3><p class="muted">Beliebtester Kurs: <b>'+pop+'</b><br>Premium-Klicks: <b>'+db.analytics.premium+'</b></p><label   const type=document.getElementById('type');type.addEventListener('change',taskFields);taskFields();
  const aside=section.closest('.dialog').querySelector('aside');
  if(aside&&!document.getElementById('paymentMethods'))aside.insertAdjacentHTML('beforeend','<div id="paymentMethods"><h3>Zahlungsarten</h3><div class="payment-list"><label><input type="checkbox" onchange="payment(\'paypal\',this.checked)" '+(db.settings.payments.paypal?'checked':'')+'> PayPal</label><label><input type="checkbox" onchange="payment(\'card\',this.checked)" '+(db.settings.payments.card?'checked':'')+'> Stripe / Kreditkarte</label><label><input type="checkbox" onchange="payment(\'apple\',this.checked)" '+(db.settings.payments.apple?'checked':'')+'> Apple Pay</label><label><input type="checkbox" onchange="payment(\'google\',this.checked)" '+(db.settings.payments.google?'checked':'')+'> Google Pay</label><label><input type="checkbox" onchange="payment(\'sepa\',this.checked)" '+(db.settings.payments.sepa?'checked':'')+'> SEPA-Lastschrift</label></div></div>');
}
function payment(name,enabled){db.settings.payments[name]=enabled;save()}
function taskFields(){
  const type=document.getElementById('type'),task=document.getElementById('task');if(!type||!task)return;
  const presets={
    'Multiple Choice':['Frage und Antwortoptionen','Wie heißt du?\\n[ Ich heiße Lena. | Ich heißen Lena. -> Ich heiße Lena. ]',''],
    'Lückentext':['Text mit Lücken','Ich ___ in Berlin.','<label>Wort-Bausteine (durch Komma trennen)<input id="wordBankInput" placeholder="wohne, wohnst, wohnt"></label>'],
    'Fehlerkorrektur':['Satz mit falscher Form','Ich wohnen in Berlin.','<label>Falsches Wort<input id="wrongWord" placeholder="wohnen"></label><label>Richtige Form<input id="rightWord" placeholder="wohne"></label>'],
    'Satzbau':['Wörter in der richtigen Reihenfolge','Ich | lerne | heute | Deutsch','<label>Richtige Satzlösung<input id="sentenceAnswer" placeholder="Ich lerne heute Deutsch."></label>'],
    'Kontext-Übung':['Kontext mit Auswahl','Im Café ___ ich einen Kaffee.','<label>Antwortoptionen (durch Komma trennen)<input id="contextOptions" placeholder="möchte, möchten, möchtet"></label><label>Richtige Antwort<input id="contextAnswer" placeholder="möchte"></label>'],
    'Wortschatz':['Wort, Form und Beispielsatz','die Sprache · die Sprachen\\nDeutsch ist eine schöne Sprache.',''],
    'Hörverstehen':['Fragen zum Hörtext','Was sucht die Person?','<label>Hörtext / Transkript<textarea id="audioText" placeholder="Guten Tag, wo ist der Bahnhof?"></textarea></label><p class="muted">Die Audio-URL wird unten im Feld audio_url hinterlegt.</p>'],
    'Interaktiver Dialog':['Dialog mit Lücke','Ich möchte ___, bitte.','<label>Wort-Bausteine (durch Komma trennen)<input id="dialogOptions" placeholder="einen Kaffee, einen Tee"></label><label>Richtige Antwort<input id="dialogAnswer" placeholder="einen Kaffee"></label>'],
    'Grammatik-Regel':['Regel und Beispiel','Das Verb steht im Hauptsatz auf Position 2.\\nHeute lerne ich Deutsch.','<label>Regel-Editor (Fettdruck und Pfeile unterstützt)<div id="ruleEditor" class="rule-editor" contenteditable="true"><b>Verbposition 2:</b> Heute <b>lerne</b> ich Deutsch. Wort A ➔ Wort B</div></label>']
  };
  const p=presets[type.value]||presets['Multiple Choice'];task.placeholder=p[1];if(!task.value)task.value=p[1];
  let extra=document.getElementById('typeExtra');if(!extra){extra=document.createElement('div');extra.id='typeExtra';task.closest('label').insertAdjacentElement('afterend',extra)}extra.innerHTML=p[2];
}
function taskData(){
  const value=id=>document.getElementById(id)?.value||'';
  return {content:value('task'),wordBank:value('wordBankInput'),wrong:value('wrongWord'),right:value('rightWord'),sentence:value('sentenceAnswer'),options:value('contextOptions'),answer:value('contextAnswer'),audioText:value('audioText'),dialogOptions:value('dialogOptions'),dialogAnswer:value('dialogAnswer'),rule:document.getElementById('ruleEditor')?.innerHTML||''};
}
function preview(){
  const type=document.getElementById('type').value,d=taskData(),box=document.getElementById('prev');box.classList.remove('hidden');
  const words=d.wordBank||'wohne,wohnst,wohnt',chips=words.split(',').map(x=>'<button class="word-chip" onclick="fillGap(\''+esc(x.trim())+'\')">'+esc(x.trim())+'</button>').join('');
  let html='<p class="eyebrow">'+esc(type)+'</p><h3>Interaktive Live-Vorschau</h3>';
  if(type==='Lückentext')html+='<div class="word-bank">'+chips+'</div><p>'+esc(d.content).replace('___','<span id="gapSlot" class="drop-slot">Lücke</span>')+'</p>';
  else if(type==='Fehlerkorrektur'){const parts=(d.content||'Ich wohnen in Berlin.').split(' ');html+='<p>'+parts.map(w=>'<button class="error-word" onclick="correctWord(this,\''+esc(d.wrong||'wohnen')+'\',\''+esc(d.right||'wohne')+'\')">'+esc(w)+'</button>').join(' ')+'</p><p class="muted">Klicke das falsche Wort an und trage die Korrektur ein.</p>'}
  else if(type==='Satzbau'){const list=(d.content||'Ich | lerne | heute | Deutsch').split('|');html+='<div id="sentenceResult" class="sentence-result">Dein Satz:</div><div class="word-bank">'+list.map(w=>'<button class="word-chip" onclick="buildSentence(this)">'+esc(w.trim())+'</button>').join('')+'</div>'}
  else if(type==='Kontext-Übung'){const opts=(d.options||'möchte,möchten,möchtet').split(',');html+='<p>'+esc(d.content).replace('___','<select onchange="contextCheck(this,\''+esc(d.answer||'möchte')+'\')"><option value="">Wählen …</option>'+opts.map(x=>'<option>'+esc(x.trim())+'</option>').join('')+'</select>')+'</p>'}
  else if(type==='Hörverstehen')html+='<audio controls class="w-full" style="width:100%" src="'+esc(document.getElementById('audio')?.value||'')+'">Audio nicht verfügbar.</audio><button class="speaker" onclick="say(\''+esc(d.audioText||'Guten Tag, wo ist der Bahnhof?')+'\')">🔊 Hörtext anhören</button><p>'+esc(d.content)+'</p>';
  else if(type==='Interaktiver Dialog'){const opts=(d.dialogOptions||'einen Kaffee,einen Tee').split(',');html+='<div class="dialog-line">👩 Guten Tag, was möchten Sie?</div><div class="dialog-line">👤 Ich möchte <span id="dialogGap" class="drop-slot">…</span>, bitte. <button class="speaker" onclick="say(\'Ich möchte einen Kaffee, bitte.\')">🔊</button></div><div class="word-bank">'+opts.map(x=>'<button class="word-chip" onclick="dialogChoose(\''+esc(x.trim())+'\',\''+esc(d.dialogAnswer||'einen Kaffee')+'\')">'+esc(x.trim())+'</button>').join('')+'</div>'}
  else if(type==='Grammatik-Regel')html+='<div class="notice" style="text-align:left">'+(d.rule||'<b>Verbposition 2:</b> Heute <b>lerne</b> ich Deutsch. Wort A ➔ Wort B')+'</div>';
  else html+='<p>'+esc(d.content).replace(/\\n/g,'<br>').replace(/\\[(.*?)\\]/g,'<mark>$1</mark>')+'</p>';
  box.innerHTML=html;
}
function fillGap(word){const slot=document.getElementById('gapSlot');if(slot){slot.textContent=word;slot.style.background='#e8f4ee'}}
function correctWord(button,wrong,right){if(button.textContent.replace(/[.,]/g,'')!==wrong.replace(/[.,]/g,'')){button.classList.add('bad');return}const input=document.createElement('input');input.placeholder='Richtige Form';input.style.width='105px';input.onchange=()=>{if(input.value.trim()===right){input.replaceWith(Object.assign(document.createElement('span'),{textContent:right,className:'error-word good'}))}else{input.style.borderColor='#b93830'}};button.replaceWith(input);input.focus()}
function buildSentence(button){const result=document.getElementById('sentenceResult');result.textContent+=' '+button.textContent;button.disabled=true;button.style.opacity='.4'}
function contextCheck(select,answer){select.style.borderColor=select.value===answer?'#176b55':'#b93830';select.style.background=select.value===answer?'#e8f4ee':'#ffe0df'}
function dialogChoose(value,answer){const gap=document.getElementById('dialogGap');gap.textContent=value;gap.style.background=value===answer?'#e8f4ee':'#ffe0df'}
function publish(){
  const d=taskData(),entry={section:document.getElementById('sect').value,topic:document.getElementById('topic').value,type:document.getElementById('type').value,data:d,image_url:document.getElementById('img').value,audio_url:document.getElementById('audio').value,date:Date.now()};
  db.content.push(entry);save();const msg=document.getElementById('msg');msg.textContent='✓ Aufgabe für '+entry.section+' veröffentlicht.';msg.classList.remove('hidden');
}
function premium(){
  db.analytics.premium++;save();const enabled=Object.entries(db.settings.payments).filter(([,ok])=>ok).map(([name])=>({paypal:'PayPal',card:'Stripe / Kreditkarte',apple:'Apple Pay',google:'Google Pay',sepa:'SEPA-Lastschrift'})[name]);
  open('<div class="dialog"><div class="dialog-top"><h2>Deutschraum Premium</h2><button class="icon" onclick="close()">✕</button></div><p>Wähle deine bevorzugte Zahlungsart.</p><div class="payment-list">'+enabled.map(x=>'<button class="secondary" onclick="alert(\'Der sichere '+x+'-Checkout wird nach Server-Konfiguration gestartet.\')">'+x+'</button>').join('')+'</div><p class="notice">Checkout nur über einen sicheren Stripe- oder PayPal-Server-Endpunkt aktivieren.</p></div>');
}
</script><script src="script.js?v=20260815-messages-wordforms"></script></body></html>
